name = "ghostty-vote"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Only reachable through the zone route below: no *.workers.dev or preview URLs,
# so the path-scoped Secure cookie always matches.
workers_dev = false
preview_urls = false

# Exactly these path prefixes on spacegho.st; every other route on the zone is untouched.
routes = [
  { pattern = "spacegho.st/mods/ffxiv/term/vote*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/term/gallery*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/almanac*", zone_name = "spacegho.st" },
  # The Dalamud plugin repository and the page explaining how to add it. The listing is
  # assembled by the Worker from each plugin repository's own release assets (src/plugins.js);
  # the page, and the committed fallback listing, are static assets.
  { pattern = "spacegho.st/mods/ffxiv/plugins*", zone_name = "spacegho.st" },
  # The mods hub (/mods/ffxiv/) and the minisites: Ghostty at term/, XivMcp, XivDesktop
  # (Almanac's is under almanac/about/, covered above). All static assets.
  { pattern = "spacegho.st/mods/ffxiv", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/site/*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/term", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/term/", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/term/media/*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/xivmcp*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/xivdesktop*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/xivarcade*", zone_name = "spacegho.st" },
  { pattern = "spacegho.st/mods/ffxiv/xivwayfinder*", zone_name = "spacegho.st" }
]

# Regenerates public/mods/ffxiv/term/vote/{ideas,version}.json and seed/seed.sql
# from data/catalogue.json before every deploy (plain node, no dependencies).
[build]
command = "node scripts/build.js"

# Static Assets: the page, vote.js, vote.css, ideas.json and version.json are served
# from public/ at their real URL paths without invoking the Worker (free, not counted
# as Worker requests). Only the API paths run the Worker. Unmatched paths under the
# route fall through to the Worker, which answers 404.
[assets]
directory = "public"
# src/plugins.js reads the committed plugins.json through this binding when GitHub is
# unreachable; nothing else uses it.
binding = "ASSETS"
html_handling = "auto-trailing-slash"   # public/.../vote/index.html is served at /vote/; /vote redirects there
not_found_handling = "none"
run_worker_first = ["/mods/ffxiv/term/vote/api/*", "/mods/ffxiv/term/gallery/api/*", "/mods/ffxiv/term/gallery/img/*", "/mods/ffxiv/term/gallery/thumb/*", "/mods/ffxiv/almanac/api/*", "/mods/ffxiv/almanac/leaderboard.json", "/mods/ffxiv/almanac/recommendations.json", "/mods/ffxiv/plugins.json"]

[[d1_databases]]
binding = "DB"
database_name = "ghostty-vote"
database_id = "ccbfb295-deb8-49ec-82c2-04a0b82ed4f3"
migrations_dir = "migrations"

# Screenshot gallery images (src/gallery.js). A KV namespace works on the free plan without
# anything else to enable; to move to R2, bind a bucket as GALLERY_R2 instead (the Worker
# prefers it) and copy the objects over. Only approved shots are ever served.
[[kv_namespaces]]
binding = "GALLERY_KV"
id = "ad74181ad97d4d3692e235c94beab40d"   # ghostty-gallery

# Non-secret sign-in settings. The secrets are set with `wrangler secret put` and never
# live in this file: GITHUB_CLIENT_SECRET, XIVAUTH_CLIENT_SECRET, SESSION_SECRET (and,
# only while rotating it, SESSION_SECRET_PREVIOUS).
[vars]
GITHUB_CLIENT_ID = "Iv23liYsdX6oOuO47ulv"          # GitHub App ghostty-for-ffxiv-vote (no repository permissions)
XIVAUTH_CLIENT_ID = "3yHMau3T_wNUzny9QQDeiSS9wRl6BjNKIN5IpHxzQyU"
ADMIN_ACCOUNTS = "github:251370"                   # 'provider:user_id', comma-separated; github:251370 is Spaceghost

# Keep the Worker's own log lines (sign-in refusals, provider errors) so a report of
# "it had errors" can be looked up afterwards. Lines never carry codes, tokens or bodies.
[observability]
enabled = true
