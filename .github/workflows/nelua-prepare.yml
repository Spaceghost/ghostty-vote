name: Prepare Nelua ballot
on:
  push:
    branches: [nelua-vote]
    paths-ignore: ['**.md']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: tools/ci/run.sh deps build check test
      - name: Commit generated outputs on the topic branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public seed scripts src tests imba wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Nelua ballot assets on remote runner'
            git push origin HEAD:nelua-vote
          fi
