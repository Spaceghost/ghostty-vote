# Deploy for real: `wrangler deploy` uploads public/ as Static Assets and
# src/worker.js as the script, in one deployment. See docs/CI.md, "Deploying".
#
# Everything that makes this safe is in the three lines it is built on:
#
#   * `environment: cloudflare` -- the only place the API token exists. No other
#     workflow and no other job in this repository can read it, and the owner can
#     put required reviewers and a branch policy on that environment so each
#     deploy waits for a click.
#   * the fork gate in `if:` -- a fork's copy of this file never deploys to the
#     owner's Cloudflare account.
#   * a missing secret fails the job with a message instead of deploying
#     something half-configured. Nothing here prints or writes the token.
#
# It deliberately does NOT run D1 migrations or the seed. Those are ordered,
# sometimes destructive steps the owner runs by hand against the live database
# before deploying (README.md, "Deploy"); a workflow doing them unasked is how a
# vote database gets rebuilt at the wrong moment.
name: Deploy

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and never cancel one halfway through an upload
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # never from a fork's copy of this workflow
    if: ${{ github.repository_owner == 'Spaceghost' && !github.event.repository.fork }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    environment: cloudflare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before wrangler is ever handed an empty token: an unauthenticated
      # `wrangler deploy` would either prompt or error out further along, and a
      # half-configured account id deploys to the wrong place.
      - name: Check the environment is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing="$missing vars.CLOUDFLARE_ACCOUNT_ID"
          if [[ -n "$missing" ]]; then
            echo "::error::the 'cloudflare' environment is missing:$missing -- see docs/CI.md, \"Deploying\", for the gh commands that set them. Nothing was deployed."
            exit 1
          fi
          echo "the cloudflare environment has an API token and an account id"

      # the same stages CI runs, so a deploy cannot go out on a red tree
      - name: Check, test, build
        run: tools/ci/run.sh check test build

      # wrangler is pinned to the same version tools/ci/run.sh uses for the dry run
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 deploy

      # GET, not HEAD: the Worker answers HEAD on a GET route with 405
      - name: Check the deployed page answers
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://spacegho.st/mods/ffxiv/term/vote/)"
          echo "GET /mods/ffxiv/term/vote/ -> $code"
          [[ "$code" == 200 ]] || { echo "::error::the deployed page answered $code, not 200"; exit 1; }
